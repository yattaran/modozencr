about:
  title: Nuestra historia
  lead: "Nacimos en la presa, literalmente."
  paragraphs:
    - "MODO ZEN nació de una idea simple: la vida moderna en Costa Rica merece pausas reales. No prometemos magia — prometemos herramientas conscientes para sobrevivir el día a día con más calma."
    - "Cada kit es curado a mano con productos locales y materiales que respetan el planeta. Desde el tráfico de la GAM hasta una tarde de café, hay un ritual para cada batalla."
    - "Somos un equipo pequeño con un perezoso como guía. Si esto resuena contigo, escríbenos — nos encanta conocer a la comunidad MODO ZEN."

