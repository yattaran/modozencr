about:
  title: Our story
  lead: "We were born in traffic — literally."
  paragraphs:
    - "MODO ZEN started with a simple idea: modern life in Costa Rica deserves real pauses. We don't promise magic — we promise mindful tools to get through the day with more calm."
    - "Each kit is hand-curated with local products and planet-friendly materials. From GAM rush hour to a slow coffee afternoon, there's a ritual for every battle."
    - "We're a small team with Zencho as our guide. If this resonates, say hi — we love meeting the MODO ZEN community."

